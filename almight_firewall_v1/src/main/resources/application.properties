server.port=7080

spring.datasource.url=jdbc:mysql://localhost:3306/almighty_fire
spring.datasource.username=root
spring.datasource.password=mysql@amma123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

logging.level.root=INFO
logging.level.com.example.firewall=DEBUG

# Threat Detection Service (External FastAPI Microservice)
threat.detection.url=http://localhost:5000
threat.detection.api=/detect

# Kafka Broker Configuration
spring.kafka.bootstrap-servers=localhost:9092

# ==============================================================================
# Kafka Producer Configuration (ACTIVE)
# almight_firewall_v1 acts as the Producer: streams logs to 'firewall_logs' topic
# ==============================================================================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# ==============================================================================
# Kafka Consumer Configuration (COMMENTED OUT)
# Log consumption has been migrated to the dedicated microservice: almighty_cassandra_log
# ==============================================================================
# spring.kafka.consumer.group-id=firewall-group
# spring.kafka.consumer.auto-offset-reset=earliest
# spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# spring.kafka.consumer.properties.spring.json.trusted.packages=*
# spring.kafka.consumer.properties.spring.json.value.default.type=com.example.firewall.dto.ClientRequestPojo

# ==============================================================================
# Spring Boot Actuator & Metrics Configuration
# ==============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=almight_firewall_v1

